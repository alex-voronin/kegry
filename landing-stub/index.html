<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Upcoming project - launching soon" />
    <title>Coming Soon: Wibblycorn</title>

    <!-- Google Fonts: modern and free -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: #0f0f17;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
      }

      .container {
        max-width: 750px;
        width: 100%;
      }

      .logo-text {
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(3.5rem, 12vw, 7.5rem);
        font-weight: 800;
        letter-spacing: -3px;
        line-height: 1.12;
        background: linear-gradient(90deg, #a78bfa, #c084fc, #f472b6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.4em;
      }

      .subtitle {
        font-size: clamp(1.25rem, 5vw, 1.75rem);
        font-weight: 500;
        color: #94a3b8;
        margin-bottom: 2.5rem;
        line-height: 1.4;
      }

      .coming-soon {
        font-size: 1.4rem;
        font-weight: 700;
        color: #c084fc;
        margin: 1.5rem 0 2.5rem;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        margin: 2rem 0;
      }

      .btn {
        display: inline-block;
        padding: 1rem 2.2rem;
        font-size: 1.15rem;
        font-weight: 600;
        border-radius: 9999px;
        text-decoration: none;
        transition: all 0.25s ease;
        cursor: pointer;
      }

      .btn-primary {
        background: linear-gradient(90deg, #7c3aed, #c084fc);
        color: white;
        border: none;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(168, 85, 247, 0.35);
      }

      .btn-outline {
        background: transparent;
        border: 2px solid #64748b;
        color: #cbd5e1;
      }

      .btn-outline:hover {
        background: rgba(99, 102, 241, 0.1);
        border-color: #a78bfa;
        color: #e0e7ff;
      }

      .social {
        margin-top: 3rem;
        font-size: 1.1rem;
        color: #94a3b8;
      }

      .social a {
        color: #c084fc;
        text-decoration: none;
        font-weight: 500;
        margin: 0 12px;
        transition: color 0.2s;
      }

      .social a:hover {
        color: #f472b6;
      }

      @media (min-width: 640px) {
        .actions {
          flex-direction: row;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="logo-text">Wibblycorn</h1>

      <p class="subtitle">
        Domain infrastructure setup in progress.<br />
        Estimated launch: 2026.
      </p>

      <div class="coming-soon">We'll let you know right after launch.</div>

      <footer style="margin-top: 4rem; font-size: 0.9rem; color: #64748b">
        © 2026 Wibblycorn™. All rights reserved.
      </footer>
    </div>
  </body>
</html>
