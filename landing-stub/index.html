<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Upcoming project - launching soon" />
    <title>Coming Soon: wibblycorn</title>

    <!-- Google Fonts: modern and free -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Space+Grotesk:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: #0f1a0f;
        color: #f1f5f9;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        position: relative;
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(15, 26, 15, 0.68),
          rgba(15, 26, 15, 0.85)
        );
        z-index: 1;
      }
      .container {
        max-width: 780px;
        width: 100%;
        position: relative;
        z-index: 2;
      }
      .logo-text {
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(3.5rem, 11vw, 7.2rem);
        font-weight: 800;
        letter-spacing: -3px;
        line-height: 1.1;
        background: linear-gradient(90deg, #84cc16, #eab308, #eab308);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.35em;
      }
      .subtitle {
        font-size: clamp(1.25rem, 4.5vw, 1.65rem);
        font-weight: 500;
        color: #d1d5db;
        margin-bottom: 2.4rem;
        line-height: 1.45;
      }
      .coming-soon {
        font-size: 1.35rem;
        font-weight: 700;
        color: #facc15;
        margin: 1.6rem 0 2.6rem;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 1.4rem;
        margin: 2.2rem 0;
      }
      .btn {
        display: inline-block;
        padding: 1.05rem 2.4rem;
        font-size: 1.12rem;
        font-weight: 600;
        border-radius: 9999px;
        text-decoration: none;
        transition: all 0.28s ease;
        cursor: pointer;
      }
      .btn-primary {
        background: linear-gradient(90deg, #65a30d, #ca8a04);
        color: white;
        border: none;
      }
      .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(202, 138, 4, 0.4);
      }
      .btn-outline {
        background: transparent;
        border: 2px solid #84cc16;
        color: #e0f2fe;
      }
      .btn-outline:hover {
        background: rgba(132, 204, 22, 0.12);
        border-color: #eab308;
        color: #fefce8;
      }
      .social {
        margin-top: 3.2rem;
        font-size: 1.05rem;
        color: #9ca3af;
      }
      .social a {
        color: #84cc16;
        text-decoration: none;
        font-weight: 500;
        margin: 0 14px;
        transition: color 0.25s;
      }
      .social a:hover {
        color: #facc15;
      }
      footer {
        margin-top: 4.5rem;
        font-size: 0.88rem;
        color: #6b7280;
      }

      @media (min-width: 640px) {
        .actions {
          flex-direction: row;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="logo-text">wibblycorn</h1>

      <p class="subtitle">
        Domain infrastructure setup in progress.<br />
        Estimated launch: 2026.
      </p>

      <div class="coming-soon">We'll let you know right after launch.</div>

      <footer style="margin-top: 4rem; font-size: 0.9rem; color: #64748b">
        © 2026 wibblycorn™. All rights reserved.
      </footer>
    </div>
  </body>
</html>
