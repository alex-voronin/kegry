# ── Shared logging config ─────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  # ── Database ────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:18-3.6
    container_name: kegry-postgres
    restart: always
    env_file:
      - ./configs/.env.postgresql
    volumes:
      - pgdata:/var/lib/postgresql
      - ./configs/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - kegry-network
    logging: *default-logging
    shm_size: 512m
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2.5G
        reservations:
          memory: 1.2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (.NET) ──────────────────────────────────────────
  backend:
    image: kegry-back:latest
    container_name: kegry-back
    restart: always
    env_file:
      - ./configs/.env.back
    environment:
      - DOTNET_GCHeapHardLimitPercent=0x50 # 80%
      - DOTNET_gcServer=0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kegry-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1600M
        reservations:
          memory: 800M

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    image: kegry-front:latest
    container_name: kegry-front
    restart: always
    environment:
      - NODE_OPTIONS=--max-old-space-size=1024
    depends_on:
      - backend
    networks:
      - kegry-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          memory: 512M

  # ── Metrics Agent (vmagent -> Grafana Cloud) ─────────────────
  vmagent:
    image: victoriametrics/vmagent:v1.139.0
    container_name: kegry-vmagent
    restart: always
    env_file:
      - ./configs/.env.vmagent
    volumes:
      - vmagentdata:/vmagentdata
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
      - "-remoteWrite.url=%{VM_REMOTE_WRITE_URL}"
      - "-remoteWrite.basicAuth.username=%{VM_REMOTE_WRITE_USERNAME}"
      - "-remoteWrite.basicAuth.password=%{VM_REMOTE_WRITE_PASSWORD}"
      - "-remoteWrite.tmpDataPath=/vmagentdata"
    networks:
      - kegry-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 64M

  # ── Host Metrics (node-exporter) ────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.11.1-busybox
    container_name: kegry-node-exporter
    restart: always
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - kegry-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M
        reservations:
          memory: 32M

  # ── Reverse Proxy (Nginx) ──────────────────────────────────
  nginx:
    image: nginx:1.29.8-alpine
    container_name: kegry-nginx
    restart: always
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - kegry-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

  # ── Cloudflare Tunnel ──────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    container_name: kegry-cloudflared
    restart: always
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./configs/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./configs/cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      - nginx
    networks:
      - kegry-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M
        reservations:
          memory: 64M

  # ── Database Backup (kartoza -> R2) ──────────────────────────
  db-backup:
    image: kartoza/pg-backup:18-3.6--v2026.03.07
    container_name: kegry-db-backup
    restart: always
    env_file:
      - ./configs/.env.postgresql
      - ./configs/.env.backup
    environment:
      - POSTGRES_HOST=kegry-postgres
      - POSTGRES_PORT=5432
      - DUMPPREFIX=kegry
      - CRON_SCHEDULE=0 3 * * *
      - REMOVE_BEFORE=7
      - STORAGE_BACKEND=S3
      - S3_RETAIN_LOCAL_DUMPS=True
      - CONSOLE_LOGGING=True
    volumes:
      - pg_backups:/db-backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kegry-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 64M

  # ── Database Backup Local Retention Policy ──────────────────────────────
  # We need it as kartoza/pg-backup can't handle local retention policy in S3 mode.
  # It keeps all dumps locally even if REMOVE_BEFORE is set. So we need to clean them up ourselves.
  # We keep 1 backup per month + all backups newer than 35 days.
  db-backup-retention:
    image: alpine:3.22
    container_name: kegry-db-backup-retention
    restart: always
    depends_on:
      - db-backup
    volumes:
      - pg_backups:/db-backups
    entrypoint: |
      /bin/sh -c '
        set -eu
        echo "=== DB Backup Retention Service started (35 days + 1 monthly) ==="

        while true; do
          echo "$$(date "+%Y-%m-%d %H:%M:%S") - Cleanup started"

          KEEP_LIST=$$(mktemp)

          # 1. Choose one oldest backup per month
          echo "→ Selecting monthly keepers..."
          find /db-backups -mindepth 2 -maxdepth 2 -type d | while read -r month_dir; do
            [ -d "$$month_dir" ] || continue

            oldest=$$(find "$$month_dir" -name "*.dmp.gz" -type f | sort | head -n 1 || true)

            if [ -n "$$oldest" ] && [ -f "$$oldest" ]; then
              base="$${oldest%.dmp.gz}"
              echo "$$oldest" >> "$$KEEP_LIST"
              [ -f "$${base}.dmp" ]               && echo "$${base}.dmp" >> "$$KEEP_LIST"
              [ -f "$${base}.dmp.gz.meta.json" ]   && echo "$${base}.dmp.gz.meta.json" >> "$$KEEP_LIST"
              echo "Keeping monthly: $$(basename "$$oldest")"
            fi
          done

          # 2. Delete files older than 35 days (except monthly keepers)
          echo "→ Deleting files older than 35 days..."
          find /db-backups -type f \( -name "*.dmp" -o -name "*.dmp.gz" -o -name "*.meta.json" \) -mtime +35 | while read -r file; do
            if ! grep -Fxq "$$file" "$$KEEP_LIST" 2>/dev/null; then
              echo "Deleting: $$file"
              rm -f "$$file"
            else
              echo "Keeping old monthly: $$file"
            fi
          done

          # 3. Clean up empty month directories
          find /db-backups -mindepth 2 -maxdepth 2 -type d -empty -delete 2>/dev/null || true

          rm -f "$$KEEP_LIST"

          echo "$$(date "+%Y-%m-%d %H:%M:%S") - Cleanup finished. Sleeping 24h."
          sleep 86400
        done
      '
    networks:
      - kegry-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.12"
          memory: 48M

volumes:
  pgdata:
  vmagentdata:
  pg_backups:

networks:
  kegry-network:
    driver: bridge
