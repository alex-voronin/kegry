# ── Shared logging config ─────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  # ── Database ────────────────────────────────────────────────
  postgres:
    image: postgres:18.3
    container_name: kegry-postgres
    restart: always
    env_file:
      - ./configs/.env.postgresql
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kegry-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (.NET) ──────────────────────────────────────────
  backend:
    image: kegry-back:latest
    container_name: kegry-back
    restart: always
    env_file:
      - ./configs/.env.back
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kegry-network
    logging: *default-logging

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    image: kegry-front:latest
    container_name: kegry-front
    restart: always
    depends_on:
      - backend
    networks:
      - kegry-network
    logging: *default-logging

  # ── Metrics Agent (vmagent -> Grafana Cloud) ─────────────────
  vmagent:
    image: victoriametrics/vmagent:latest
    container_name: kegry-vmagent
    restart: always
    env_file:
      - ./configs/.env.vmagent
    volumes:
      - vmagentdata:/vmagentdata
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
      - "-remoteWrite.url=${VM_REMOTE_WRITE_URL}"
      - "-remoteWrite.basicAuth.username=${VM_REMOTE_WRITE_USERNAME}"
      - "-remoteWrite.basicAuth.password=${VM_REMOTE_WRITE_PASSWORD}"
      - "-remoteWrite.tmpDataPath=/vmagentdata"
    networks:
      - kegry-network
    logging: *default-logging

  # ── Host Metrics (node-exporter) ────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: kegry-node-exporter
    restart: always
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - kegry-network
    logging: *default-logging

  # ── Reverse Proxy (Nginx) ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: kegry-nginx
    restart: always
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - kegry-network
    logging: *default-logging

  # ── Cloudflare Tunnel ──────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kegry-cloudflared
    restart: always
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./configs/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./configs/cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      - nginx
    networks:
      - kegry-network
    logging: *default-logging

volumes:
  pgdata:
  vmagentdata:

networks:
  kegry-network:
    driver: bridge
