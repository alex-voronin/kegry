# ── Shared logging config ─────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  # ── Database ────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:18-3.6
    container_name: kegry-postgres
    restart: always
    env_file:
      - ./configs/.env.postgresql
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./configs/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "5432:5432"
    networks:
      - kegry-network
    logging: *default-logging
    shm_size: 512m
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2.5G
        reservations:
          memory: 1.2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (.NET) ──────────────────────────────────────────
  backend:
    image: kegry-back:latest
    container_name: kegry-back
    restart: always
    env_file:
      - ./configs/.env.back
    environment:
      - DOTNET_GCHeapHardLimitPercent=0x55 # 85%
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kegry-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1600M
        reservations:
          memory: 800M

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    image: kegry-front:latest
    container_name: kegry-front
    restart: always
    environment:
      - NODE_OPTIONS=--max-old-space-size=1024
    depends_on:
      - backend
    networks:
      - kegry-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          memory: 512M

  # ── Metrics Agent (vmagent -> Grafana Cloud) ─────────────────
  vmagent:
    image: victoriametrics/vmagent:v1.139.0
    container_name: kegry-vmagent
    restart: always
    env_file:
      - ./configs/.env.vmagent
    volumes:
      - vmagentdata:/vmagentdata
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
      - "-remoteWrite.url=${VM_REMOTE_WRITE_URL}"
      - "-remoteWrite.basicAuth.username=${VM_REMOTE_WRITE_USERNAME}"
      - "-remoteWrite.basicAuth.password=${VM_REMOTE_WRITE_PASSWORD}"
      - "-remoteWrite.tmpDataPath=/vmagentdata"
    networks:
      - kegry-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 64M

  # ── Host Metrics (node-exporter) ────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.11.1-busybox
    container_name: kegry-node-exporter
    restart: always
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - kegry-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 128M
        reservations:
          memory: 32M

  # ── Reverse Proxy (Nginx) ──────────────────────────────────
  nginx:
    image: nginx:1.29.8-alpine
    container_name: kegry-nginx
    restart: always
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - kegry-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

  # ── Cloudflare Tunnel ──────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    container_name: kegry-cloudflared
    restart: always
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./configs/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./configs/cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      - nginx
    networks:
      - kegry-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M
        reservations:
          memory: 64M

volumes:
  pgdata:
  vmagentdata:

networks:
  kegry-network:
    driver: bridge
