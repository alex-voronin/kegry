# ── Shared logging config ─────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  # ── Database ────────────────────────────────────────────────
  postgres:
    image: postgres:18.3
    container_name: kegry-postgres
    restart: always
    env_file:
      - ./configs/.env.postgresql
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kegry-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (.NET) ──────────────────────────────────────────
  backend:
    image: kegry-back:latest
    container_name: kegry-back
    restart: always
    env_file:
      - ./configs/.env.back
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kegry-network
    logging: *default-logging

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    image: kegry-front:latest
    container_name: kegry-front
    restart: always
    depends_on:
      - backend
    networks:
      - kegry-network
    logging: *default-logging

  # ── Metrics (VictoriaMetrics) ───────────────────────────────
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: kegry-victoriametrics
    restart: always
    volumes:
      - vmdata:/victoria-metrics-data
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
      - "-retentionPeriod=30d"
    ports:
      - "8428:8428"
    networks:
      - kegry-network
    logging: *default-logging

  # ── Reverse Proxy (Nginx) ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: kegry-nginx
    restart: always
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - kegry-network
    logging: *default-logging

  # ── Cloudflare Tunnel ──────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kegry-cloudflared
    restart: always
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./configs/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./configs/cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      - nginx
    networks:
      - kegry-network
    logging: *default-logging

volumes:
  pgdata:
  vmdata:

networks:
  kegry-network:
    driver: bridge
