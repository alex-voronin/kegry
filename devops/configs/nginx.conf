worker_processes 2;

events {
    worker_connections 2048;
}

http {
    # JSON access-log format
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # Timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    keepalive_timeout     30s;

    # Upstream definitions
    upstream backend {
        server kegry-back:5214;
    }

    upstream frontend {
        server kegry-front:3000;
    }

    server {
        listen 80;
        server_name kegry.com www.kegry.com;

        return 302 https://kegry.rs$request_uri;
    }

    server {
        listen 80;
        server_name business.kegry.com www.business.kegry.com;

        return 302 https://business.kegry.rs$request_uri;
    }

    server {
        listen 80;
        server_name kegry.net www.kegry.net;

        return 302 https://kegry.rs$request_uri;
    }

    server {
        listen 80;
        server_name business.kegry.net www.business.kegry.net;

        return 302 https://business.kegry.rs$request_uri;
    }

    server {
        listen 80;
        server_name www.kegry.rs;

        return 302 https://kegry.rs$request_uri;
    }

    server {
        listen 80;
        server_name kegry.rs business.kegry.rs admin.kegry.rs;

        # API requests -> backend
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # admin panel -> backend
        location /admin/ {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else -> frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (Next.js HMR / live updates)
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
