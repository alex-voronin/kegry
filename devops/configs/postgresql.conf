# ─────────────────────────────────────────────────────────────
# PostgreSQL 18 — Tuned for 2.5 GB RAM / 1.5 CPU / SSD
# ─────────────────────────────────────────────────────────────

# ── Connections ──────────────────────────────────────────────
listen_addresses = '*'
max_connections = 100

# ── Memory ───────────────────────────────────────────────────
shared_buffers = 640MB                  # ~25% of container RAM
effective_cache_size = 1920MB           # ~75% of container RAM (hints query planner)
work_mem = 8MB                          # per sort/hash operation
maintenance_work_mem = 160MB            # VACUUM, CREATE INDEX

# ── WAL ──────────────────────────────────────────────────────
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9      # spread checkpoint I/O

# ── Disk / SSD ───────────────────────────────────────────────
random_page_cost = 1.1                  # SSD (default 4.0 = spinning disk)
effective_io_concurrency = 200          # SSD can handle many parallel reads

# ── Parallelism ──────────────────────────────────────────────
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# ── Misc ─────────────────────────────────────────────────────
huge_pages = off                        # not available in Docker
logging_collector = off                 # let Docker handle logs via stdout
