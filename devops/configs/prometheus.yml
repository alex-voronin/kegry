# vmagent scrape configuration
# Backend exposes Prometheus metrics on port 9500
# node-exporter exposes host metrics on port 9100
scrape_configs:
  - job_name: "kegry-backend"
    scrape_interval: 60s
    static_configs:
      - targets: ["kegry-back:9500"]

  - job_name: "node-exporter"
    scrape_interval: 60s
    static_configs:
      - targets: ["kegry-node-exporter:9100"]
